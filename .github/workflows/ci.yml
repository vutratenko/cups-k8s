name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static and entrypoint tests
        run: make test
      - name: Kustomize validate
        run: kubectl kustomize deploy/base | kubectl apply --dry-run=client -f -

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: image
          push: false
          load: true
          tags: registry.sion2k.ru/home/cups-hplip:ci
      - name: Image smoke test
        run: IMAGE=registry.sion2k.ru/home/cups-hplip:ci bash tests/test_image_smoke.sh
