[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=eth0,enp*,ens*,eno*,bond*,br*,host0
deny-interfaces=lo,docker0,cni0,flannel.1,cilium*,lxc*,veth*
enable-dbus=yes
publish-hinfo=no
publish-workstation=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=no
publish-addresses=yes

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
