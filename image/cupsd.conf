# CUPS: LAN IPP, web admin, mDNS sharing (Bonjour / AirPrint clients).
LogLevel info
PageLogFormat
MaxLogSize 0
SystemGroup lpadmin root
AccessLogLevel actions
ErrorPolicy retry-job

Listen 0.0.0.0:631
ServerAlias *
Browsing On
BrowseLocalProtocols dnssd
DefaultShared yes
WebInterface Yes

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin>
  Order allow,deny
  Allow @LOCAL
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Cancel-Job CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit All>
    Order deny,allow
    Allow @LOCAL
  </Limit>
</Policy>
