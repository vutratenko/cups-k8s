# CUPS: LAN IPP + sharing; admin only via local socket/exec.
LogLevel info
PageLogFormat
MaxLogSize 0
SystemGroup lpadmin root
AccessLogLevel actions
ErrorPolicy retry-job

Listen 0.0.0.0:631
Browsing Off
DefaultShared yes
WebInterface No

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin>
  Order deny,allow
  Deny all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Cancel-Job CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer>
    Order deny,allow
    Deny all
  </Limit>
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
    Allow @LOCAL
  </Limit>
  <Limit All>
    Order deny,allow
    Allow @LOCAL
  </Limit>
</Policy>
